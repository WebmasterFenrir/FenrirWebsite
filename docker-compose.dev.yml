services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "3460:80"
    volumes:
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-net
    restart: unless-stopped

  site:
    build: .
    container_name: fenrir-site
    expose:
      - "4321"
    environment:
      - VIRTUAL_HOST=fenrir.nilsmertens.dev
      - VIRTUAL_PORT=4321
      - PB_URL=http://pocketbase:3000
      - PUBLIC_PB_URL=http://localhost:3421
      - PB_EMAIL=${PB_ADMIN_EMAIL}
      - PB_PASSWORD=${PB_ADMIN_PASSWORD}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - proxy-net
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_PB_URL: http://localhost:3421
    container_name: fenrir-dashboard
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=dashboard.fenrir.nilsmertens.dev
      - VIRTUAL_PORT=80
    networks:
      - proxy-net
    restart: unless-stopped

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    environment:
      PB_PORT: 3000
      PB_ADMIN_EMAIL: webmaster@fenrirclub.be
      PB_ADMIN_PASSWORD: Fenrir123456789!
      TZ: Europe/Berlin
    expose:
      - "3000"
    volumes:
      - ./pb_data:/pb_data
      - ./src/apps/pocketbase/pb_migrations:/pb_migrations
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy-net
    restart: unless-stopped

networks:
  proxy-net:

volumes:
  vhost:
  html:
