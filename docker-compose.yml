services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-net
    restart: unless-stopped

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: letsencrypt-companion
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=webmaster@fenrirclub.be
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-net
    restart: unless-stopped

  site:
    build: .
    container_name: fenrir-site
    expose:
      - "4321"
    environment:
      - VIRTUAL_HOST=fenrirclub.be,www.fenrirclub.be
      - VIRTUAL_PORT=4321
      - LETSENCRYPT_HOST=fenrirclub.be,www.fenrirclub.be
      - LETSENCRYPT_EMAIL=webmaster@fenrirclub.be
      - PB_URL=http://pocketbase:3000
      - PUBLIC_PB_URL=https://pb.fenrirclub.be
      - PB_EMAIL=${PB_ADMIN_EMAIL}
      - PB_PASSWORD=${PB_ADMIN_PASSWORD}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - proxy-net
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_PB_URL: https://pb.fenrirclub.be
    container_name: fenrir-dashboard
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=dashboard.fenrirclub.be
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=dashboard.fenrirclub.be
      - LETSENCRYPT_EMAIL=webmaster@fenrirclub.be
    networks:
      - proxy-net
    restart: unless-stopped

  events-sync:
    build:
      context: .
      dockerfile: src/apps/events-sync/Dockerfile
    container_name: fenrir-events-sync
    environment:
      - PB_URL=http://pocketbase:3000
      - PB_EMAIL=${PB_ADMIN_EMAIL}
      - PB_PASSWORD=${PB_ADMIN_PASSWORD}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - proxy-net
    restart: unless-stopped

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    environment:
      PB_PORT: 3000
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      EVENTS_SYNC_URL: http://events-sync:3000
      TZ: Europe/Berlin
      VIRTUAL_HOST: pb.fenrirclub.be
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: pb.fenrirclub.be
      LETSENCRYPT_EMAIL: webmaster@fenrirclub.be
    expose:
      - "3000"
    volumes:
      - ./pb_data:/pb_data
      - ./src/apps/pocketbase/pb_migrations:/pb_migrations
      - ./src/apps/pocketbase/pb_hooks:/pb_hooks
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy-net
    restart: unless-stopped

networks:
  proxy-net:

volumes:
  certs:
  vhost:
  html:
  acme:
